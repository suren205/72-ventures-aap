<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>72 Ventures Khata</title>
<meta name="theme-color" content="#12284a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: navy masthead with the company seal, a tab rail, then one working sheet per tab. Money is always right-aligned in tabular figures. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --sunk:#eaeef3; --ink:#0f1b2d; --muted:#586a80; --line:#dbe2ea;
  --accent:#0c8a7e; --accent-ink:#ffffff; --soft:#e2f3f0;
  --head:#12284a; --head-ink:#f2f5fa; --head-muted:#a9b9d0; --gold:#c79a3a;
  --good:#1c7f47; --good-bg:#e3f4ea; --warn:#9a6511; --warn-bg:#fbefd6; --bad:#b83227; --bad-bg:#fbe5e2; --blue:#2c5cc9;
  --display:"Rozha One","Mukta",Georgia,serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a121d; --surface:#111c2b; --sunk:#172436; --ink:#e7edf5; --muted:#93a4ba; --line:#25354a;
  --accent:#2fc2b2; --accent-ink:#04211e; --soft:#12332f;
  --head:#0e1b31; --head-ink:#f2f5fa; --head-muted:#93a4ba; --gold:#d6ab4c;
  --good:#5fd08f; --good-bg:#123322; --warn:#e9b65a; --warn-bg:#3a2c10; --bad:#f08a80; --bad-bg:#3d1a17; --blue:#7fa4f5;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0a121d; --surface:#111c2b; --sunk:#172436; --ink:#e7edf5; --muted:#93a4ba; --line:#25354a;
  --accent:#2fc2b2; --accent-ink:#04211e; --soft:#12332f;
  --head:#0e1b31; --head-ink:#f2f5fa; --head-muted:#93a4ba; --gold:#d6ab4c;
  --good:#5fd08f; --good-bg:#123322; --warn:#e9b65a; --warn-bg:#3a2c10; --bad:#f08a80; --bad-bg:#3d1a17; --blue:#7fa4f5;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
@media (max-width:560px){.top-tools{flex-basis:100%}}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px;max-width:560px}
.pic{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);cursor:zoom-in;aspect-ratio:4/3}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:64px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block}
.thumb button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:var(--surface);font-weight:700;cursor:pointer;line-height:1}
.big{width:100%;border-radius:8px;display:block}
.login{max-width:380px;width:100%;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.login h2{font-family:var(--display);font-weight:400;font-size:24px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* masthead */
.top{background:var(--head);color:var(--head-ink)}
.top-in{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.seal{width:60px;height:60px;flex:none;display:block}
.login-logo{width:180px;max-width:70%;align-self:center;border-radius:10px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4.5vw,27px);line-height:1.2;text-wrap:balance}
.brand p{color:var(--head-muted);font-size:14px}
.top-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--head-muted);color:var(--head-ink)}
.role.admin{border-color:var(--gold);color:var(--gold)}
.lang{background:transparent;border:1px solid var(--head-muted);color:var(--head-ink);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600;cursor:pointer}

/* tabs */
.tabs-wrap{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs{max-width:1120px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px 8px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar h2{font-family:var(--display);font-weight:400;font-size:24px}
.bar .tools{display:flex;gap:8px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:14.5px}

.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:16px;font-weight:700;margin-bottom:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}

/* balance strip */
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fig{padding:14px 16px;border-inline-start:1px solid var(--line);margin-inline-start:-1px;border-top:1px solid var(--line);margin-top:-1px}
.fig .k{font-size:13.5px;color:var(--muted);font-weight:600}
.fig .v{font-size:clamp(21px,3.4vw,28px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.fig .n{font-size:13px;color:var(--muted)}
.fig.main .v{color:var(--accent)}

/* 12-month track */
.track{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:120px}
.track .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.track .barv{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.track .col.p2 .barv{background:var(--blue)}
.track .col.zero .barv{background:var(--line)}
.track .amt{font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.tlabels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin-top:4px}
.tlabels span{font-size:11.5px;text-align:center;color:var(--muted);border-top:2px solid var(--line);padding-top:3px;overflow:hidden;white-space:nowrap}
.tlabels span.now{color:var(--ink);font-weight:700;border-top-color:var(--gold)}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;font-size:13px;font-weight:600}
.phases span:first-child{color:var(--accent)} .phases span:last-child{color:var(--blue)}

.meter{display:flex;flex-direction:column;gap:12px}
.meter .row{display:flex;flex-direction:column;gap:4px}
.meter .lab{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.meter .lab b{font-variant-numeric:tabular-nums}
.meter .rail{height:9px;border-radius:9px;background:var(--sunk);overflow:hidden}
.meter .rail i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.meter .rail i.b{background:var(--blue)} .meter .rail i.g{background:var(--gold)}

.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.list .li:first-child{border-top:0}
.list .li>div{min-width:0}
.list small{color:var(--muted);display:block}

.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.in{color:var(--good)} .out{color:var(--bad)}

.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--sunk);border-top:1px solid var(--line)}
td.num,th.num{text-align:right}
.grid td,.grid th{padding:6px 6px;text-align:center}
.grid th:first-child,.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);padding-inline:12px;white-space:nowrap}
.grid th:first-child,.grid tfoot td:first-child{background:var(--sunk)}
.grid th.now{color:var(--ink);box-shadow:inset 0 -3px var(--gold)}
.cell{display:inline-grid;place-items:center;min-width:34px;height:30px;border-radius:6px;border:1px solid transparent;background:none;font-weight:700;font-variant-numeric:tabular-nums}
button.cell{cursor:pointer;border-color:var(--line)}
.cell.paid{background:var(--soft);color:var(--accent);border-color:transparent}
.cell.due{background:var(--warn-bg);color:var(--warn);font-size:12px;border-color:transparent}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-family:var(--display);font-weight:400;font-size:21px}
.empty p{color:var(--muted);max-width:52ch}

.notice{border-top:1px solid var(--line);padding:14px 0}
.notice:first-child{border-top:0;padding-top:0}
.notice h3{margin-bottom:2px}
.notice p{white-space:pre-wrap;max-width:70ch}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.rules ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(5,12,24,.55)}
.dlg-in{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg-in h2{font-family:var(--display);font-weight:400;font-size:21px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:14px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{min-height:110px;resize:vertical}
.fld .fixed{font-weight:700}
.live{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.err{color:var(--bad);font-weight:600;font-size:14.5px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-foot .sp{flex:1}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--head-ink);padding:8px 16px;border-radius:99px;font-weight:600;font-size:14.5px;max-width:calc(100vw - 32px);z-index:20}
</style>

</div></header>

  S.deposits.forEach(d=>{sav[d.memberId]=(sav[d.memberId]||0)+num(d.amount);shr[d.memberId]=(shr[d.memberId]||0)+num(d.shares);dep+=num(d.amount);shares+=num(d.shares);fees+=num(d.fee)});
  const paid={}, last={}; let repP=0, repI=0;
  S.repays.forEach(r=>{paid[r.loanId]=(paid[r.loanId]||0)+num(r.principal);repP+=num(r.principal);repI+=num(r.interest);if(!last[r.loanId]||r.date>last[r.loanId])last[r.loanId]=r.date});
  let lent=0, out=0; const owe={}, td=today();
  const loans=S.loans.map(l=>{const o=Math.max(0,num(l.principal)-(paid[l.id]||0));lent+=num(l.principal);out+=o;owe[l.memberId]=(owe[l.memberId]||0)+o;
    const dueOn=addMonths(l.issued,num(l.term));const from=last[l.id]&&last[l.id]>l.issued?last[l.id]:l.issued;
    const days=Math.max(0,Math.round((parse(td)-parse(from))/864e5));
    return {...l,out:o,repaid:paid[l.id]||0,dueOn,status:o<=0?'closed':(td>dueOn?'overdue':'active'),accrued:Math.round(o*num(l.rate)/100*days/365)}});
  let inc=0, exp=0; S.entries.forEach(e=>e.kind==='expense'?exp+=num(e.amount):inc+=num(e.amount));
  const cash=dep+fees+repP+repI+inc-exp-lent, capital=dep+fees+repI+inc-exp;
  const pool=capital*num(c.allocLoan)/100;
  const limit=id=>Math.max(0,(sav[id]||0)*num(c.loanLimitPct)/100-(owe[id]||0));
  return {c,mBy,sav,shr,dep,shares,fees,repI,lent,out,owe,loans,inc,exp,cash,capital,pool,poolLeft:Math.max(0,pool-out),limit,nm:id=>mBy[id]?mBy[id].name:'—'};
}
function ledgerRows(){
  const r=[];
  S.deposits.forEach(d=>{r.push({date:d.date||d.month+'-01',type:'dep',desc:C.nm(d.memberId)+' · '+fmonth(d.month,true)+' · '+fmt(d.shares)+' '+t('shares'),in:num(d.amount),out:0});if(num(d.fee)>0)r.push({date:d.date||d.month+'-01',type:'fee',desc:C.nm(d.memberId)+' · '+fmonth(d.month,true),in:num(d.fee),out:0})});
  S.loans.forEach(l=>r.push({date:l.issued,type:'loan',desc:C.nm(l.memberId)+(l.purpose?' · '+l.purpose:''),in:0,out:num(l.principal)}));
  S.repays.forEach(p=>{const l=S.loans.find(x=>x.id===p.loanId);r.push({date:p.date,type:'rep',desc:(l?C.nm(l.memberId):'—')+' · '+t('principal')+' '+fmt(p.principal)+' + '+t('interest')+' '+fmt(p.interest),in:num(p.principal)+num(p.interest),out:0})});
  S.entries.forEach(e=>r.push({date:e.date,type:e.kind==='expense'?'expense':'income',desc:[e.category,e.note].filter(Boolean).join(' · '),in:e.kind==='expense'?0:num(e.amount),out:e.kind==='expense'?num(e.amount):0,id:e.id}));
  r.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let bal=0; r.forEach(x=>{bal+=x.in-x.out;x.bal=bal});
  return r;
}

function drawThumbs(){const box=$('#f-imgs');if(!box)return;box.innerHTML=F.imgs.map(id=>`<span class="thumb"><img src="/img/${id}.jpg" alt=""><button type="button" data-act="rm-img" data-id="${id}" aria-label="${t('del')}">×</button></span>`).join('');$('#f-imgfile').hidden=F.imgs.length>=F.imgMax}
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.82))};im.onerror=()=>{URL.revokeObjectURL(u);no({msg:'bad_image'})};im.src=u})}

  for(const f of files){toast(t('uploading'));try{const r=await api('upload',{data:await shrink(f)});F.imgs.push(r.id);drawThumbs()}catch(e){fail(errText(e))}}});

    {id:'title',label:t('title'),value:n?.title,req:1},{id:'date',label:t('date'),type:'date',value:n?.date||today(),req:1},
    {id:'body',label:t('message'),type:'textarea',value:n?.body},
    {id:'images',label:t('photos'),type:'images',value:n?.images||[]}],
   check:v=>!v.body&&!v.images.length?t('e_need',t('message')):'',
   save:v=>put('notices',id,v),del:n?()=>col('notices').doc(id).delete():null});
}
function fSettings(){
  const c=cfg(), N=(id,k,z)=>({id,label:t(k),type:'number',value:c[id],req:1,zero:z});
  openForm({title:t('edit_settings'),fields:[
    {id:'name',label:t('co_name'),value:c.name,req:1},N('shareValue','share_value'),N('minShares','min_sh'),N('maxShares','max_sh'),N('dueDay','due_day'),N('graceDays','grace',1),N('lateFee','fee_amt',1),
    {id:'startMonth',label:t('start_m'),value:c.startMonth,req:1,ph:'2026-11'},
    N('loanRate','rate',1),N('loanLimitPct','limit_pct'),N('loanTermMax','term_max'),N('allocInvest','a_inv',1),N('allocLoan','a_loan',1),N('allocReserve','a_res',1),
    {id:'bank',label:t('bank'),value:c.bank},{id:'chair',label:t('chair'),value:c.chair},{id:'treasurer',label:t('treasurer'),value:c.treasurer},
    {id:'openLedger',label:t('open_ledger'),type:'select',value:c.openLedger,options:[{v:'no',l:t('no')},{v:'yes',l:t('yes')}]}],
   check:v=>!/^\d{4}-(0[1-9]|1[0-2])$/.test(v.startMonth)?t('e_month'):(v.allocInvest+v.allocLoan+v.allocReserve!==100?t('e_alloc'):(v.minShares>v.maxShares?t('share_range',fmt(v.minShares),fmt(v.maxShares)):'')),
   save:v=>db.doc('config/main').set(v)});
}
function memberInfo(id){
  const m=C.mBy[id]; if(!m)return;
  const ds=S.deposits.filter(d=>d.memberId===id).sort((a,b)=>a.month<b.month?-1:1), ls=C.loans.filter(l=>l.memberId===id);
  openInfo(m.name,`<dl class="kv" style="margin:0"><dt>${t('serial')}</dt><dd>${sn(m)}</dd><dt>${t('role')}</dt><dd>${roleName(m.role)}</dd><dt>${t('joined')}</dt><dd>${fdate(m.joined)||'—'}</dd>${m.address?`<dt>${t('address')}</dt><dd>${esc(m.address)}</dd>`:''}${S.admin||m.id===S.me?`<dt>${t('nominee')}</dt><dd>${nomineeTxt(m)}</dd>`:''}<dt>${t('shares')}</dt><dd>${fmt(C.shr[id]||0)}</dd><dt>${t('saved')}</dt><dd>${money(C.sav[id]||0)}</dd><dt>${t('loan_out')}</dt><dd>${money(C.owe[id]||0)}</dd><dt>${t('loan_limit')}</dt><dd>${money(C.limit(id))}</dd></dl>
  <div><b>${t('savings')}</b><div class="list">${ds.map(d=>`<div class="li"><div>${fmonth(d.month,true)}<small>${fdate(d.date)} · ${fmt(d.shares)} ${t('shares')}${proofBtns(d)}</small></div><b class="num">${money(d.amount)}</b></div>`).join('')||`<p class="sub">${t('none_yet')}</p>`}</div></div>
  ${ls.length?`<div><b>${t('loans')}</b><div class="list">${ls.map(l=>`<div class="li"><div>${fdate(l.issued)} ${statusChip(l.status)}<small>${t('outstanding')}: ${money(l.out)}</small></div><b class="num">${money(l.principal)}</b></div>`).join('')}</div></div>`:''}`);
}
function loanInfo(id){
  const l=C.loans.find(x=>x.id===id); if(!l)return;
  const rs=S.repays.filter(r=>r.loanId===id).sort((a,b)=>a.date<b.date?-1:1);
  openInfo(C.nm(l.memberId)+' · '+money(l.principal),`<dl class="kv" style="margin:0"><dt>${t('status')}</dt><dd>${statusChip(l.status)}</dd><dt>${t('rate_s')}</dt><dd>${fmt(l.rate)}%</dd><dt>${t('issued')}</dt><dd>${fdate(l.issued)}</dd><dt>${t('due_date')}</dt><dd>${fdate(l.dueOn)}</dd><dt>${t('repaid')}</dt><dd>${money(l.repaid)}</dd><dt>${t('outstanding')}</dt><dd>${money(l.out)}</dd>${l.purpose?`<dt>${t('purpose')}</dt><dd>${esc(l.purpose)}</dd>`:''}</dl>
  <div><b>${t('repayments')}</b><div class="list">${rs.map(r=>`<div class="li"><div>${fdate(r.date)}<small>${t('principal')} ${fmt(r.principal)} + ${t('interest')} ${fmt(r.interest)}${r.note?' · '+esc(r.note):''}</small></div><span style="white-space:nowrap"><b class="num">${money(num(r.principal)+num(r.interest))}</b>${S.admin?` <button class="btn ghost sm" data-act="edit-repay" data-id="${r.id}" data-loan="${id}">${t('edit')}</button>`:''}</span></div>`).join('')||`<p class="sub">${t('none_yet')}</p>`}</div></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='tab'){S.tab=id;try{history.replaceState(null,'','#'+id)}catch(e){}render();window.scrollTo(0,0);return}
  if(a==='lang'){S.lang=S.lang==='ne'?'en':'ne';try{localStorage.setItem('k72-lang',S.lang)}catch(e){}render();return}
  if(a==='close'){dlg.close();return}
  if(a==='install'){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}return}
  if(a==='logout'){api('logout',{}).finally(()=>{lastJson='';S.state='login';S.tab='home';render()});return}
  if(a==='chg-pass')return fPassword();
  if(a==='view-img'){F=null;dlg.innerHTML=`<div class="dlg-in"><img class="big" src="/img/${id}.jpg" alt=""><div class="dlg-foot"><button class="btn ghost" data-act="close">${t('close')}</button></div></div>`;if(!dlg.open)dlg.showModal();return}
  if(a==='rm-img'){if(F){F.imgs=F.imgs.filter(x=>x!==id);drawThumbs()}return}
  if(a==='go-signup'||a==='go-login'){S.state=a==='go-signup'?'signup':'login';S.note='';render();return}
  if(a==='view-member')return memberInfo(id);
  if(a==='view-loan')return loanInfo(id);
  if(!S.admin)return;
  if(a==='approve'||a==='reject'){const m=S.pending.find(x=>x.id===id); if(!m)return;
    if(a==='reject'&&!b.dataset.sure){b.dataset.sure=1;b.textContent=t('del_sure');return}
    b.disabled=true; (a==='approve'?api('save',{col:'members',id,data:{...m,status:'active',admin:'no',password:''}}):api('delete',{col:'members',id})).then(load).then(()=>toast(a==='approve'?t('saved_ok'):t('deleted_ok'))).catch(e=>{b.disabled=false;toast(errText(e))});return}
  if(a==='form-del'){ if(!b.dataset.sure){b.dataset.sure=1;b.textContent=t('del_sure');return}
    const d=F.del; b.disabled=true; d().then(()=>{dlg.close();toast(t('deleted_ok'))}).catch(e=>{b.disabled=false;delete b.dataset.sure;b.textContent=t('del');fail(e&&e.soft?e.soft:e&&e.msg==='has_records'?t('has_records'):errText(e))});return}
  ({'add-member':()=>{S.tab='members';render();fMember()},'edit-member':()=>fMember(id),'dep':()=>fDeposit(b.dataset.m,b.dataset.ym),'add-dep':()=>fDeposit(),
    'add-loan':()=>fLoan(),'edit-loan':()=>fLoan(id),'repay':()=>fRepay(id),'edit-repay':()=>fRepay(b.dataset.loan,id),
    'add-entry':()=>fEntry(),'edit-entry':()=>fEntry(id),'add-notice':()=>fNotice(),'edit-notice':()=>fNotice(id),'edit-settings':()=>fSettings()}[a]||(()=>{}))();
});
document.addEventListener('change',ev=>{if(ev.target.id==='ledger-filter'){S.filter=ev.target.value;render()}});

/* ---------- boot ---------- */
try{const l=localStorage.getItem('k72-lang');if(l==='en'||l==='ne')S.lang=l}catch(e){}
const h=location.hash.slice(1); if(TABS.includes(h))S.tab=h;
let raf=0; const queue=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})};
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
window.addEventListener('appinstalled',()=>{installEvt=null;render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();
load();
setInterval(()=>{if(S.state==='ready'&&!document.hidden&&!dlg.open)load()},30000);
</script>
</body></html>
